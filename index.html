    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(DATA));
    return new TextDecoder().decode(pt);
  }
  var f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err');
  f.addEventListener('submit',async function(e){
    e.preventDefault();err.textContent='';
    try{var html=await dec(pw.value);document.open();document.write(html);document.close();}
    catch(_){err.textContent="That's not it — try again.";pw.value='';pw.focus();}
  });
})();
</script>
